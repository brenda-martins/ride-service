name: ride
services:
  postgres:
    hostname: postgres
    container_name: postgres
    image: 'postgres:18'
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ride
    volumes:
      - ride-db-data:/var/lib/postgresql
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  ride-db-data:
